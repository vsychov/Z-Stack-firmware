name: Z-Stack radio tests
on:
  push:
    paths:
      - 'coordinator/Z-Stack_3.x.0/firmware.patch'
      - 'coordinator/Z-Stack_3.x.0/tests/**'
      - '.github/workflows/backhaul-tests.yml'
  pull_request:
    paths:
      - 'coordinator/Z-Stack_3.x.0/firmware.patch'
      - 'coordinator/Z-Stack_3.x.0/tests/**'
      - '.github/workflows/backhaul-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 coordinator/Z-Stack_3.x.0/tests/test_backhaul.py
